<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
<title>HTTP 测试</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7;
  --card: #ffffff;
  --ink: #111827;
  --muted: #6b7280;
  --line: #e5e7eb;
  --brand: #111827;
  --brand-ink: #ffffff;
  --err: #dc2626;
  --ok: #059669;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0c0f;
    --card: #16181d;
    --ink: #f3f4f6;
    --muted: #9ca3af;
    --line: #262a31;
    --brand: #f3f4f6;
    --brand-ink: #111827;
    --err: #f87171;
    --ok: #34d399;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  display: flex;
  justify-content: center;
  padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
}
main { width: 100%; max-width: 520px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 26px 22px;
  box-shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
}
.lock {
  width: 44px; height: 44px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  border: 1px solid var(--line);
  margin-bottom: 14px;
  color: var(--muted);
}
h1 { font-size: 21px; line-height: 1.35; margin: 0 0 6px; font-weight: 650; letter-spacing: 0.2px; }
.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
form { display: flex; flex-direction: column; gap: 10px; }
input[type="password"], input[type="text"] {
  width: 100%;
  padding: 14px 16px;
  font-size: 17px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  outline: none;
  text-align: center;
  letter-spacing: 2px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  -webkit-appearance: none;
  appearance: none;
}
input:focus { border-color: var(--muted); box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.16); }
button {
  width: 100%;
  padding: 14px 16px;
  font-size: 16px;
  font-weight: 600;
  color: var(--brand-ink);
  background: var(--brand);
  border: 0;
  border-radius: 12px;
  cursor: pointer;
  transition: opacity 0.15s ease, transform 0.06s ease;
}
button:active { transform: scale(0.99); }
button[disabled] { opacity: 0.55; cursor: default; }
.err { min-height: 22px; margin: 12px 0 0; color: var(--err); font-size: 14px; text-align: center; }
.err.shake { animation: shake 0.32s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
.progress { margin: 12px 0 0; color: var(--muted); font-size: 13px; text-align: center; min-height: 20px; }
.results { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.file {
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  background: var(--bg);
}
.file img {
  display: block;
  width: 100%;
  height: auto;
  background: #fff;
}
.meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
}
.name { font-size: 14px; font-weight: 600; word-break: break-all; }
.size { font-size: 12px; color: var(--muted); margin-top: 2px; }
.dl {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}
.hidden { display: none !important; }
footer { margin-top: 16px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; }
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="lock"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10" width="15" height="10.5" rx="2.6"/><path d="M8 10V7.4a4 4 0 0 1 8 0V10"/><circle cx="12" cy="15.2" r="1.3" fill="currentColor" stroke="none"/></svg></div>
    <h1>HTTP 测试</h1>
    <p class="sub">输入发送人给你的密码，打开对应的文件</p>
    <form id="gate" autocomplete="off">
      <input id="pw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="密码" aria-label="密码" required>
      <button id="go" type="submit">打开</button>
    </form>
    <p id="err" class="err" role="alert"></p>
    <p id="progress" class="progress"></p>
    <div id="out" class="results"></div>
  </section>
  <footer>
    文件以 AES-256-GCM 加密存放，密码只在你的手机上参与解密<br>
    图片可长按保存到相册 · 其他文件点「下载」
  </footer>
</main>
<script>
(function () {
  var ITEMS = [{"i":1,"v":"86924a86ee"}];
  var ITERATIONS = 310000;
  var SALT_BYTES = 16, IV_BYTES = 12;
  var enc = new TextEncoder();
  var dec = new TextDecoder();

  var form = document.getElementById('gate');
  var input = document.getElementById('pw');
  var button = document.getElementById('go');
  var errBox = document.getElementById('err');
  var progress = document.getElementById('progress');
  var out = document.getElementById('out');
  var cache = {};

  function fail(message) {
    errBox.textContent = message;
    errBox.classList.remove('shake');
    void errBox.offsetWidth;
    errBox.classList.add('shake');
  }

  function mimeOf(name) {
    var ext = (name.split('.').pop() || '').toLowerCase();
    var map = {
      jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif',
      webp: 'image/webp', bmp: 'image/bmp', avif: 'image/avif', svg: 'image/svg+xml',
      pdf: 'application/pdf', txt: 'text/plain', md: 'text/plain', json: 'application/json',
      doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      ppt: 'application/vnd.ms-powerpoint', pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      zip: 'application/zip', rar: 'application/vnd.rar', mp4: 'video/mp4', mov: 'video/quicktime'
    };
    return map[ext] || 'application/octet-stream';
  }

  function readable(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }

  function loadBlob(item) {
    var key = String(item.i);
    if (cache[key]) return cache[key];
    cache[key] = fetch('data/' + item.i + '.bin?v=' + item.v, { cache: 'default' }).then(function (res) {
      if (!res.ok) throw new Error('文件加载失败（' + res.status + '）');
      return res.arrayBuffer();
    }).then(function (buf) {
      return new Uint8Array(buf);
    });
    return cache[key];
  }

  function deriveKey(password, salt) {
    return crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
        base,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    });
  }

  function openItem(password, item) {
    return loadBlob(item).then(function (blob) {
      if (blob.length < SALT_BYTES + IV_BYTES + 16) throw new Error('bad blob');
      var salt = blob.slice(0, SALT_BYTES);
      var iv = blob.slice(SALT_BYTES, SALT_BYTES + IV_BYTES);
      var body = blob.slice(SALT_BYTES + IV_BYTES);
      return deriveKey(password, salt).then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, key, body);
      }).then(function (plainBuf) {
        var plain = new Uint8Array(plainBuf);
        var headerLength = (plain[0] << 8) | plain[1];
        var header = JSON.parse(dec.decode(plain.slice(2, 2 + headerLength)));
        return { name: header.n, kind: header.k, bytes: plain.slice(2 + headerLength) };
      });
    });
  }

  function render(opened) {
    out.innerHTML = '';
    out.classList.remove('hidden');
    opened.forEach(function (file) {
      var mime = mimeOf(file.name);
      var blob = new Blob([file.bytes], { type: mime });
      var url = URL.createObjectURL(blob);
      var wrap = document.createElement('div');
      wrap.className = 'file';
      if (file.kind === 'img') {
        var img = document.createElement('img');
        img.src = url;
        img.alt = file.name;
        img.loading = 'lazy';
        img.decoding = 'async';
        wrap.appendChild(img);
      }
      var meta = document.createElement('div');
      meta.className = 'meta';
      var left = document.createElement('div');
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = file.name;
      var size = document.createElement('div');
      size.className = 'size';
      size.textContent = readable(file.bytes.length);
      left.appendChild(name);
      left.appendChild(size);
      var link = document.createElement('a');
      link.className = 'dl';
      link.href = url;
      link.download = file.name;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = file.kind === 'img' ? '保存' : '下载';
      meta.appendChild(left);
      meta.appendChild(link);
      wrap.appendChild(meta);
      out.appendChild(wrap);
    });
  }

  var busy = false;

  function submit() {
    if (busy) return;
    var password = input.value;
    errBox.textContent = '';
    if (!password) {
      fail('请输入密码');
      return;
    }
    if (!window.crypto || !window.crypto.subtle) {
      fail('当前浏览器不支持解密，请在系统浏览器（如 Safari / Chrome）中打开本页');
      return;
    }
    busy = true;
    button.disabled = true;
    button.textContent = '验证中…';
    out.innerHTML = '';
    progress.textContent = ITEMS.length > 1 ? '正在尝试 ' + ITEMS.length + ' 个文件…' : '';

    var opened = [];
    var loadError = null;
    var index = 0;

    function step() {
      if (index >= ITEMS.length) {
        busy = false;
        button.disabled = false;
        button.textContent = '打开';
        progress.textContent = '';
        if (!opened.length) {
          // A wrong password and an unreachable file both fail here; telling
          // them apart matters, because during the first Pages build the page
          // exists while its blobs are still 404.
          if (loadError) {
            fail('文件还在构建或暂时取不到，请稍后再试（' + loadError.message + '）');
            return;
          }
          fail('密码错误');
          return;
        }
        input.blur();
        render(opened);
        return;
      }
      var item = ITEMS[index];
      index += 1;
      openItem(password, item).then(function (file) {
        opened.push(file);
        step();
      }, function (error) {
        // OperationError means "this password did not open this file"; anything
        // else (network, 404, malformed blob) is a real problem worth reporting.
        if (!error || error.name !== 'OperationError') {
          if (!loadError) loadError = error || new Error('未知错误');
        }
        step();
      });
    }

    step();
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    submit();
  });
})();
</script>
</body>
</html>
